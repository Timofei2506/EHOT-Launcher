name: CI

# Что делает этот workflow (по-простому):
#  1. build-test — на каждый push и pull request собирает решение и прогоняет тесты
#     на Linux, Windows и macOS. Если где-то ошибка — тут будет красный крестик.
#  2. publish — собирает готовые к запуску сборки (Windows .exe, macOS для Intel и Apple Silicon)
#     и кладёт их в «Artifacts». Это не установщик, а папка с программой.
# Секретов не требует: всё, что нужно, ставится автоматически.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Версия приложения в одном месте: Directory.Build.props → <Version>. Здесь только читаем.
  APP_VERSION: '0.2.0'
  # Релизы (установщики) публикуются в отдельном публичном репозитории.
  # Из него же лаунчер и сайт берут список версий — без токена.
  UPDATE_REPOSITORY: Timofei2506/EHOT-Launcher-Releases
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Сборка и тесты (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Показать версию SDK
        run: dotnet --version

      - name: Восстановить пакеты
        run: dotnet restore EHOT.Launcher.slnx

      - name: Собрать (ошибки в предупреждениях запрещены)
        run: dotnet build EHOT.Launcher.slnx -c Debug --no-restore -warnaserror

      - name: Тесты
        # XUnit v3 сам сообщает о падениях кодом возврата; UI-тесты работают headless (без экрана).
        run: dotnet test EHOT.Launcher.slnx -c Debug --no-build --logger "trx;LogFileName=results.trx"

      - name: Сохранить отчёт о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/results.trx'
          if-no-files-found: ignore

  publish:
    name: Сборка приложения (${{ matrix.rid }})
    # Запускаем только если сборка и тесты прошли на всех системах.
    needs: build-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Собрать self-contained приложение
        # --self-contained true: .NET внутри, пользователю не нужно ничего ставить.
        run: >
          dotnet publish src/EHOT.Launcher.UI/EHOT.Launcher.UI.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:DebugType=embedded -p:UpdateRepository=${{ env.UPDATE_REPOSITORY }}
          -o artifacts/${{ matrix.rid }}

      - name: Упаковать в архив
        shell: bash
        run: |
          cd artifacts
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "EHOT-Launcher-${{ matrix.rid }}.zip" "${{ matrix.rid }}" > /dev/null
          else
            # macOS: сохраняем права на исполняемые файлы и .app-структуру
            ditto -c -k --sequesterRsrc --keepParent "${{ matrix.rid }}" "EHOT-Launcher-${{ matrix.rid }}.zip"
          fi

      - name: Выложить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: EHOT-Launcher-${{ matrix.rid }}
          path: artifacts/EHOT-Launcher-${{ matrix.rid }}.zip
          if-no-files-found: error

  installers:
    name: Установщик (${{ matrix.platform }})
    needs: [build-test, publish]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            rid: win-x64
          - platform: macos-arm64
            os: macos-latest
            rid: osx-arm64
          - platform: macos-x64
            os: macos-latest
            rid: osx-x64

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      # ---------- Windows: Inno Setup ----------
      - name: Собрать приложение (Windows)
        if: matrix.platform == 'windows'
        run: >
          dotnet publish src/EHOT.Launcher.UI/EHOT.Launcher.UI.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:DebugType=embedded -p:UpdateRepository=${{ env.UPDATE_REPOSITORY }}
          -o artifacts/${{ matrix.rid }}

      - name: Установить Inno Setup
        if: matrix.platform == 'windows'
        run: choco install innosetup --no-progress -y

      - name: Собрать установщик .exe
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "packaging\windows\ehot-launcher.iss" "/DAppVersion=${{ env.APP_VERSION }}" "/DSourceDir=${{ github.workspace }}\artifacts\${{ matrix.rid }}" "/DOutputDir=${{ github.workspace }}\artifacts\installers"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup завершился с кодом $LASTEXITCODE" }

      # ---------- macOS: .app + .dmg ----------
      - name: Собрать приложение (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: >
          dotnet publish src/EHOT.Launcher.UI/EHOT.Launcher.UI.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:DebugType=embedded -p:UpdateRepository=${{ env.UPDATE_REPOSITORY }}
          -o artifacts/${{ matrix.rid }}

      - name: Собрать .dmg
        if: startsWith(matrix.platform, 'macos')
        env:
          ARCH: ${{ matrix.platform == 'macos-arm64' && 'arm64' || 'x64' }}
        run: |
          bash packaging/macos/make-dmg.sh "artifacts/${{ matrix.rid }}" "${APP_VERSION}" "${ARCH}" artifacts/installers

      - name: (macOS) ad-hoc подпись — чтобы .app запускался на своей машине
        if: startsWith(matrix.platform, 'macos')
        run: |
          APP="artifacts/installers/EHOT Launcher.app"
          codesign --force --deep --sign - "$APP" || echo "ad-hoc подпись недоступна, продолжаем без неё"
          # Gatekeeper: собственная сборка не считается карантинной, но проверим структуру
          codesign --verify --deep "$APP" || true

      - name: Выложить установщик
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            artifacts/installers/*.exe
            artifacts/installers/*.dmg
          if-no-files-found: error

  release:
    # Публикация релиза: тег v<версия>, установщики в публичный репозиторий релизов,
    # обновление downloads/ на сайте и деплой лендинга в Vercel.
    # Запускается вручную (workflow_dispatch) — чтобы релиз никогда не выходил «сам собой».
    name: Публикация релиза
    if: github.event_name == 'workflow_dispatch'
    needs: [build-test, installers]
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Скачать установщики
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: artifacts/installers
          merge-multiple: true

      - name: Показать собранные файлы
        run: ls -lR artifacts/installers

      - name: Проверить, что все три установщика на месте
        run: |
          set -euo pipefail
          for f in "EHOT-Launcher-${APP_VERSION}-win-x64-setup.exe" \
                   "EHOT-Launcher-${APP_VERSION}-osx-arm64.dmg" \
                   "EHOT-Launcher-${APP_VERSION}-osx-x64.dmg"; do
            test -f "artifacts/installers/$f" || { echo "нет файла $f"; ls artifacts/installers; exit 1; }
          done

      - name: Контрольные суммы
        run: |
          cd artifacts/installers
          sha256sum *.exe *.dmg | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Создать релиз и приложить установщики
        env:
          # Токен с правом записи в репозиторий релизов (секрет репозитория).
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ env.UPDATE_REPOSITORY }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          if gh release view "$TAG" --repo "$RELEASES_REPO" > /dev/null 2>&1; then
            echo "Релиз $TAG уже есть — обновляю файлы"
            gh release upload "$TAG" artifacts/installers/*.exe artifacts/installers/*.dmg --repo "$RELEASES_REPO" --clobber
          else
            gh release create "$TAG" --repo "$RELEASES_REPO" --title "EHOT Launcher ${APP_VERSION}" \
              --notes "Сборка ${APP_VERSION} (beta). Установщики для Windows и macOS." \
              artifacts/installers/*.exe artifacts/installers/*.dmg
          fi

      - name: Обновить манифест загрузок на сайте
        run: |
          python3 - <<'PYEOF'
          import json, hashlib, os, datetime
          root = "artifacts/installers"
          def entry(kind, name, platform):
              path = os.path.join(root, name)
              data = open(path, "rb").read()
              return {"kind": kind, "name": name, "size": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(), "platform": platform}
          v = os.environ["APP_VERSION"]
          manifest = {
              "version": v,
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "notes": "Обновление интерфейса: переработаны все разделы лаунчера.",
              "files": [
                  entry("win", f"EHOT-Launcher-{v}-win-x64-setup.exe", "Windows x64"),
                  entry("mac-arm", f"EHOT-Launcher-{v}-osx-arm64.dmg", "macOS Apple Silicon"),
                  entry("mac-x64", f"EHOT-Launcher-{v}-osx-x64.dmg", "macOS Intel"),
              ],
              "checksums": "SHA256SUMS.txt",
          }
          os.makedirs("site/downloads", exist_ok=True)
          json.dump(manifest, open("site/downloads/manifest.json", "w"), ensure_ascii=False, indent=2)
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PYEOF
          cp artifacts/installers/SHA256SUMS.txt site/downloads/SHA256SUMS.txt

      - name: Закоммитить манифест и ссылки на сайте
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/downloads/manifest.json site/downloads/SHA256SUMS.txt site/index.html
          git diff --cached --quiet || git commit -m "site: загрузки ${APP_VERSION}"
          git push

      - name: Установить Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Деплой сайта в Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
